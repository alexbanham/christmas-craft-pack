# Publishes both channels to GitHub Pages on every push:
#   https://<owner>.github.io/<repo>/stable/pack.toml   (what friends' launchers and the server use)
#   https://<owner>.github.io/<repo>/testing/pack.toml  (what Alex tests first)
name: publish-pack
on:
  push:
    branches: [stable, testing]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: stable, path: stable }
      - uses: actions/checkout@v4
        with: { ref: testing, path: testing }
      - name: Assemble site
        run: |
          mkdir -p _site
          for ch in stable testing; do
            rm -rf "$ch/.git" "$ch/.github"
            cp -r "$ch" "_site/$ch"
          done
          for ch in stable testing; do rm -rf "_site/$ch/site" "_site/$ch/scripts"; done
          # Download page at the root: version + mods from stable (what the button installs),
          # template from testing so page changes go live without a pack promotion.
          python3 testing/scripts/build_site.py --pack _site/stable --testing _site/testing --out _site
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
