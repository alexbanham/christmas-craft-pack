# Lithium settings for Christmas Craft. Everything else stays at Lithium's defaults.
# Options: https://github.com/CaffeineMC/lithium/wiki/Configuration-File
#
# Crash fix (2026-11-27): Lithium 0.15.4's faster fluid flow numbers the blocks it searches in a signed byte, so a
# fluid that looks 7 to 9 blocks ahead for a slope reads past the start of its array and stops the server
# ("Exception ticking world", ArrayIndexOutOfBoundsException in FlowingFluid.calculateComplexFluidFlowDirections).
# Create Confectionery's ruby chocolate and dark chocolate look 8 ahead; they form granite and scorchia.
# Turning this one option off puts fluid flow back on Minecraft's own code. Remove it once Lithium reads the index
# unsigned.
mixin.block.fluid.flow=false
